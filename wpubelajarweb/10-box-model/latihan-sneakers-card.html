<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneakers Card</title>
    <link rel="stylesheet" href="sneakers-card.css" />
  </head>
  <body>
    <article class="product-card">
      <figure class="product-image">
        <img src="image/Nike Air Max 1 London.jpg" alt="Nike Airmax" />
      </figure>

      <p class="nike">NIKE SPORTWEAR</p>

      <h2 class="judul">Air Max 1</h2>

      <p class="prolog">
        Kombinasi semperuna antara retro dan kenyamanan modern. Dilengkapi
        dengan teknologi Air-Sole untuk bantalan yang responsif untuk setiap
        hari.
      </p>

      <div class="price-section">
        <span class="price">RP 1,899,000</span>
        <del class="coret">RP 2,299,000</del>
      </div>

      <form action="">
        <fieldset class="size-options-wrapper">
          <legend class="size-label">Pilih Ukuran (US)</legend>
          <div class="size-options">
            <input type="radio" name="size" id="s8" value="8" />
            <label for="s8">8</label>

            <input type="radio" name="size" id="s9" value="9" />
            <label for="s9">9</label>

            <input type="radio" name="size" id="s10" value="10" />
            <label for="s10">10</label>

            <input type="radio" name="size" id="s11" value="11" />
            <label for="s11">11</label>

            <input type="radio" name="size" id="s12" value="12" />
            <label for="s12">12</label>
          </div>
        </fieldset>

        <button class="buy-button" type="submit">Tambah ke Keranjang</button>
      </form>
    </article>
  </body>
</html>
