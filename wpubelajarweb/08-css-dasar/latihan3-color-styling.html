<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Styling - 263040074</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: #f8f8ff;
        text-align: center;
        background-color: #0f172a;
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: rgb(67, 67, 67);
        text-shadow: 5px 2px 0 rgb(128 128 128 / 10%);
        color: #38baf4;
      }

      .quotes {
        font-size: 22px;
        line-height: 2, 2;
        word-spacing: 5px;
      }

      .coret {
        text-decoration: line-through;
        color: rgb(187, 1, 1);
      }

      .penyanyi {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(176, 176, 176);
      }
    </style>
  </head>
  <body>
    <h1 class="sorai">Sorai</h1>

    <p class="quotes">
      "Kau dan aku saling membantu membasuh hati yang pernah
      <span class="coret">pilu</span>,<br />
      mungkin akhir nya tak jadi satu namun bersorai pernah bertemu."
    </p>

    <p class="penyanyi">-Nadin Amizah</p>
  </body>
</html>
