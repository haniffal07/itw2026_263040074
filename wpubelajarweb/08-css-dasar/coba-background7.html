<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Background</title>
    <style>
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #333;
      }

      .frame {
        width: 400px;
        height: 400px;
        border: 10px solid white;
        margin: auto;
        background-image:
          url(img/Gemini_Generated_Image_nurdpinurdpinurd-removebg-preview.png),
          url(img/gemini-svg.svg), url(img/Code_Generated_Image.png);
        background-size: 700px, 400px, 500px;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-position:
          center bottom,
          center 10%,
          bottom left;
        background-color: #f0f0f0;
        border-radius: 50%;
      }

      h1 {
        color: white;
        text-align: center;
        font-family: "Courier New", Courier, monospace;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
  </body>
</html>
