<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Styling - 263040074</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: #f8f8ff;
        text-align: center;
        background-color: #0f172a;
        background-image:
          linear-gradient(
            to bottom,
            rgb(15 25 42 / 90%) 50%,
            rgb(15 25 42 / 60%)
          ),
          url(https://picsum.photos/id/10/1000/1000);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }

      h1 {
        font-size: 4em;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: none;
        text-decoration-color: rgb(67, 67, 67);
        /* text-shadow: 5px 2px 0 rgb(128 128 128 / 10%); */
        background-image: linear-gradient(
          to right,
          rgb(50, 50, 253),
          rgb(241, 136, 241)
        );
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 10px rgb(42, 177, 192));
      }

      .quotes {
        font-size: 22px;
        line-height: 2, 2;
        word-spacing: 5px;
        background-color: rgb(255 255 255 / 5%);
        max-width: 700px;
        margin: auto;
        padding: 40px;
        border-radius: 15px;
        border: rgb(255 255 255 / 10%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
      }

      .coret {
        text-decoration: none;
        color: crimson;
        text-shadow: 0 0 10px rgba(239, 68, 102, 0.8);
      }

      .penyanyi {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(176, 176, 176);
        text-transform: uppercase;
        border-top: 1px solid rgb(255 255 255 / 20%);
        width: 30%;
        margin: 30px auto;
        padding-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1 class="sorai">Sorai</h1>

    <p class="quotes">
      "Kau dan aku saling membantu membasuh hati yang pernah
      <span class="coret">pilu</span>,<br />
      mungkin akhir nya tak jadi satu namun bersorai pernah bertemu."
    </p>

    <p class="penyanyi">-Nadin Amizah</p>
  </body>
</html>
