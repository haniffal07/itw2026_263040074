<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen form pada HTML</h1>
    <form>
      <label for="nama"
        >Nama:
        <input type="text" name="nama" id="nama" placeholder="Masukkan nama" />
      </label>
      <br />

      <label for="password"
        >Password
        <input type="password" name="password" id="password" />
      </label>
      <br />

      <label for="email"
        >Email:
        <input type="email" name="email" id="email" />
      </label>
      <br />

      <label for="angka"
        >Angka:
        <input
          type="number"
          name="number"
          id="angka"
          min="-100"
          max="100"
          step="5"
        />
      </label>
      <br />

      <label for="tanggal"
        >Tanggal:
        <input type="date" name="tanggal" id="tanggl" />
      </label>
      <br />

      <label for="warna"
        >Pilih warna:
        <input type="color" name="warna" id="warna " />
      </label>
      <br />

      <label for="url"
        >url:
        <input type="url" name="url" id="url" />
      </label>
      <br />

      <label for="telephon"
        >No.telp:
        <input type="tel" name="No.telp" id="No.telp" />
      </label>
      <br />

      <label for="radio"
        >Radio:
        <input type="radio" name="radio" id="radio" />
      </label>
      <br />

      <label for="file"
        >File:
        <input type="file" name="file" id="file" />
      </label>
      <br />

      <label for="checkbox"
        >Checkbox:
        <input type="checkbox" name="checkbox" id="checkbox" />
      </label>
      <br />

      <br />
      <button type="submit">Kirim!</button>
    </form>
  </body>
</html>
