<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh input atribut, checkbox & radio button</title>
  </head>
  <body>
    <h1>Contoh input atribut, checkbox & radio button</h1>

    <form>
      <label for="nama"
        >Nama:
        <input
          type="name"
          name="nama"
          id="nama"
          placeholder="Masukkan nama"
          autocomplete="off"
          autofocus
          required
        />
      </label>
      <br />

      <h3>Hobby:</h3>
      <label for="hobby1">
        Olahraga
        <input
          type="checkbox"
          name="hobby1"
          id="hobby1"
          value="Olahraga"
          checked
        />
      </label>

      <br />
      <label for="hobby2">
        Ngoding
        <input type="checkbox" name="hobby2" id="hobby2" value="ngoding" />
      </label>
      <br />

      <h3>Jenis Kelamin</h3>
      <label for="pria">
        <input
          type="radio"
          name="Jenis_Kelamin"
          id="pria"
          value="pria"
          checked
        />Pria
      </label>
      <br />
      <label for="wanita">
        <input
          type="radio"
          name="Jenis_Kelamin"
          id="wanita"
          value="wanita"
        />Wanita
      </label>

      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
